[project]
name = "retrieval-regression-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "fastapi[standard]>=0.140.8",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name and import name differ, so hatchling cannot infer the package.
[tool.hatch.build.targets.wheel]
packages = ["src/harness"]
